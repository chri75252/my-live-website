name: V10 Reveal Motion Policy

on:
  pull_request:
    branches: [main]
    paths:
      - js/tbm-cinematic-v10.js
      - css/tbm-cinematic-v10.css
      - tests/test_tbm_v10_reduced_motion.py
      - .github/workflows/v10-reveal-motion-policy.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reduced-motion-reveal:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Validate V10 source and assets
        run: |
          node --check js/tbm-cinematic-v10.js
          python scripts/validate-tbm-v10-assets.py
      - name: Install Playwright Chromium
        run: |
          python -m pip install --disable-pip-version-check playwright==1.53.2
          python -m playwright install --with-deps chromium
      - name: Start static preview
        run: python -m http.server 4173 --bind 127.0.0.1 > /tmp/tbm-v10-preview.log 2>&1 &
      - name: Verify reveal ignores reduced-motion preference
        run: python tests/test_tbm_v10_reduced_motion.py
