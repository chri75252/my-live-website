name: Apply Public Copy and Brand Correction

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/apply_public_copy_brand_correction.py"
      - ".github/workflows/apply-public-copy-brand-correction.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/public-copy-logo-forge-images
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install image tooling
        run: python -m pip install --disable-pip-version-check pillow
      - name: Patch migration for final public surface
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          path = Path('scripts/apply_public_copy_brand_correction.py')
          text = path.read_text(encoding='utf-8')

          pattern = re.compile(
              r'''    text = replace_once\(\n'''
              r'''        text,\n'''
              r'''        "Ideas, tools and shifts shaping modern commerce\.",\n'''
              r'''        "Practical guides and perspectives on ecommerce, AI, retail technology and modern business\.",\n'''
              r'''        "blog hero lead",\n'''
              r'''    \)'''
          )
          replacement = '''    text = replace_once(
              text,
              '<p class="seo-lead">Ideas, tools and shifts shaping modern commerce.</p>',
              '<p class="seo-lead">Practical guides and perspectives on ecommerce, AI, retail technology and modern business.</p>',
              "blog hero lead",
          )'''
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'Unable to patch blog hero replacement: {count} matches')

          text = text.replace(
              'image = ImageOps.fit(image, (1200, 1500), method=Image.Resampling.LANCZOS)',
              'image = ImageOps.fit(image, (640, 800), method=Image.Resampling.LANCZOS)',
              1,
          )
          text = text.replace(
              'image.save(output_dir / output_name, "WEBP", quality=84, method=6)',
              'image.save(output_dir / output_name, "WEBP", quality=82, method=6)',
              1,
          )
          path.write_text(text, encoding='utf-8')
          PY
      - name: Apply corrective migration
        run: python scripts/apply_public_copy_brand_correction.py
      - name: Finalise generated copy and validation rules
        run: |
          python - <<'PY'
          from pathlib import Path

          validator = Path('scripts/validate_corrective_surface.py')
          text = validator.read_text(encoding='utf-8')
          text = text.replace('"blog.html": 10,', '"blog.html": 6,', 1)
          validator.write_text(text, encoding='utf-8')
          PY
      - name: Synchronise sitemap
        run: python scripts/generate_sitemap.py
      - name: Validate generated surface
        env:
          PR_BASE_SHA: 8451f98a4db3ae3497257298ca8d24f480a897b3
        run: |
          python scripts/seo_validate.py
          python scripts/validate_corrective_surface.py
          git diff --check
      - name: Commit generated changes
        shell: bash
        run: |
          set -euo pipefail
          git restore scripts/apply_public_copy_brand_correction.py
          if git diff --quiet && [[ -z "$(git status --porcelain)" ]]; then
            echo "No generated changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html about.html products.html blog.html partnership.html contact.html faq.html editorial-standards.html privacy-policy.html terms.html 404.html testimonials.html editorial-policy.html research-methodology.html ai-content-policy.html blog css/seo-content-v2.css images/favicon-tbm.svg images/favicon-48.png images/apple-touch-icon.png images/categories data/content-manifest.json sitemap.xml scripts/validate_corrective_surface.py
          git commit -m "fix: replace internal copy and correct public brand hierarchy"
          git push origin HEAD:fix/public-copy-logo-forge-images
