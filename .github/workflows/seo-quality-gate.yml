name: SEO Quality Gate

on:
  pull_request:
    branches: [main]
    paths:
      - "**.html"
      - "robots.txt"
      - "sitemap.xml"
      - "llms.txt"
      - "data/content-manifest.json"
      - "css/seo-content.css"
      - "css/seo-content-v2.css"
      - "css/secondary-cards.css"
      - "js/secondary-nav.js"
      - "js/card-spotlight.js"
      - "images/site/**"
      - "scripts/seo_validate.py"
      - "scripts/validate_corrective_surface.py"
      - "scripts/generate_sitemap.py"
      - ".github/workflows/seo-quality-gate.yml"
  push:
    branches: [main, fix/secondary-card-layout-images-spotlight]
    paths:
      - "**.html"
      - "robots.txt"
      - "sitemap.xml"
      - "llms.txt"
      - "data/content-manifest.json"
      - "css/seo-content.css"
      - "css/seo-content-v2.css"
      - "css/secondary-cards.css"
      - "js/secondary-nav.js"
      - "js/card-spotlight.js"
      - "images/site/**"
      - "scripts/seo_validate.py"
      - "scripts/validate_corrective_surface.py"
      - "scripts/generate_sitemap.py"
      - ".github/workflows/seo-quality-gate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Validate canonical public surface
        run: python scripts/seo_validate.py
      - name: Validate corrective public surface
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python scripts/validate_corrective_surface.py
      - name: Confirm sitemap is synchronized
        run: python scripts/generate_sitemap.py --check
      - name: Check whitespace and patch integrity
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            git diff --check "$PR_BASE_SHA...$PR_HEAD_SHA"
          elif [[ -n "$PUSH_BEFORE_SHA" && ! "$PUSH_BEFORE_SHA" =~ ^0+$ ]]; then
            git diff --check "$PUSH_BEFORE_SHA...$CURRENT_SHA"
          elif git rev-parse HEAD^ >/dev/null 2>&1; then
            git diff --check HEAD^..HEAD
          else
            git diff --check
          fi
