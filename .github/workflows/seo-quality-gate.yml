name: SEO Quality Gate

on:
  pull_request:
    branches: [main]
    paths:
      - "**.html"
      - "robots.txt"
      - "sitemap.xml"
      - "llms.txt"
      - "data/content-manifest.json"
      - "css/seo-content.css"
      - "scripts/seo_validate.py"
      - "scripts/generate_sitemap.py"
      - ".github/workflows/seo-quality-gate.yml"
  push:
    branches: [main, seo/search-authority-foundation]
    paths:
      - "**.html"
      - "robots.txt"
      - "sitemap.xml"
      - "llms.txt"
      - "data/content-manifest.json"
      - "css/seo-content.css"
      - "scripts/seo_validate.py"
      - "scripts/generate_sitemap.py"
      - ".github/workflows/seo-quality-gate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Validate canonical public surface
        run: python scripts/seo_validate.py
      - name: Confirm sitemap is synchronized
        run: python scripts/generate_sitemap.py --check
      - name: Check whitespace and patch integrity
        run: git diff --check
