name: Apply Indexing Hygiene

on:
  push:
    branches: [fix/search-indexing-crawl-hygiene]
    paths:
      - scripts/apply_indexing_hygiene.py
      - scripts/seo_validate.py
      - .github/workflows/apply-indexing-hygiene.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/search-indexing-crawl-hygiene
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Normalize crawl signals
        run: python scripts/apply_indexing_hygiene.py
      - name: Validate SEO surface
        run: |
          python scripts/seo_validate.py
          python scripts/generate_sitemap.py --check
      - name: Commit generated crawl-hygiene changes
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          if git diff --quiet; then
            echo "No generated changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.html' data/content-manifest.json sitemap.xml
          git commit -m "seo: normalize canonical home links"
          git push origin HEAD:fix/search-indexing-crawl-hygiene
