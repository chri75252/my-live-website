name: Category Image Contact Sheet

on:
  pull_request:
    branches: [main]
    paths:
      - "images/*.png"
      - ".github/workflows/category-image-contact-sheet.yml"
  push:
    branches: [fix/public-copy-logo-forge-images]
    paths:
      - "images/*.png"
      - ".github/workflows/category-image-contact-sheet.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contact-sheet:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow
      - name: Build labelled contact sheet
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw, ImageFont, ImageOps

          paths = sorted(Path('images').glob('*.png'))
          paths = [p for p in paths if len(p.stem) > 20]
          if not paths:
              raise SystemExit('No uploaded category PNGs found')

          cell_w, cell_h = 360, 500
          image_h = 420
          cols = 3
          rows = (len(paths) + cols - 1) // cols
          sheet = Image.new('RGB', (cols * cell_w, rows * cell_h), '#101010')
          draw = ImageDraw.Draw(sheet)
          small = ImageFont.load_default(size=14)

          for index, path in enumerate(paths):
              row, col = divmod(index, cols)
              x, y = col * cell_w, row * cell_h
              with Image.open(path) as source:
                  image = ImageOps.exif_transpose(source).convert('RGB')
                  fitted = ImageOps.fit(image, (cell_w - 24, image_h - 24), method=Image.Resampling.LANCZOS)
              sheet.paste(fitted, (x + 12, y + 12))
              label = f'{chr(65 + index)}  {path.name}'
              draw.rectangle((x + 12, y + image_h, x + cell_w - 12, y + cell_h - 12), fill='#191919')
              draw.text((x + 20, y + image_h + 14), label, fill='#f0c66c', font=small)

          output = Path('category-image-contact-sheet.jpg')
          sheet.save(output, quality=92, optimize=True)
          print(f'Created {output} from {len(paths)} images')
          PY
      - name: Package corrective working files
        run: |
          zip -r repository-snapshot.zip \
            ./*.html blog/*.html css/seo-content-v2.css css/secondary-cards.css \
            scripts/validate_corrective_surface.py scripts/seo_validate.py scripts/generate_sitemap.py \
            data/content-manifest.json sitemap.xml images/*.png images/tbm-logo-actual.svg images/tbm-logo.svg \
            .github/workflows/seo-quality-gate.yml
      - uses: actions/upload-artifact@v4
        with:
          name: category-image-contact-sheet
          path: category-image-contact-sheet.jpg
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: corrective-repository-snapshot
          path: repository-snapshot.zip
          retention-days: 7
