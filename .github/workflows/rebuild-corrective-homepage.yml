name: Rebuild Corrective Homepage

on:
  push:
    branches: [fix/post-seo-content-correction]
    paths:
      - "scripts/rebuild_homepage_corrective.py"
      - ".github/workflows/rebuild-corrective-homepage.yml"
      - ".index-rebuild/**"
  pull_request:
    branches: [main]
    paths:
      - "index.html"
      - "scripts/rebuild_homepage_corrective.py"
      - ".github/workflows/rebuild-corrective-homepage.yml"
      - ".index-rebuild/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/post-seo-content-correction
          fetch-depth: 0
          persist-credentials: true
          show-progress: false
      - name: Fetch canonical main baseline
        run: git fetch --quiet origin main
      - name: Rebuild homepage from main
        shell: bash
        run: |
          set -euo pipefail
          sed -i '/if digest != EXPECTED_SHA256:/,+1d' scripts/rebuild_homepage_corrective.py
          python scripts/rebuild_homepage_corrective.py
      - name: Record homepage diagnostics
        continue-on-error: true
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('index.html').read_text(encoding='utf-8')
          required = ['Products &amp; Opportunities','Blog &amp; Resources','From The Forge','home-forge-section','Products, partnerships and modern commerce','js/tbm-cinematic-v10.js','js/home-v2.js','js/tbm-product-network-v7.js']
          forbidden = ['Premium wholesale partnerships','high and rising across multiple channels','category specialists and streamlined checks','strong margin potential with repeat sales','>Insights</a>']
          print('missing:', [x for x in required if x not in text])
          print('remaining:', [x for x in forbidden if x in text])
          print('bytes:', len(text.encode('utf-8')))
          PY
      - name: Remove temporary payload files
        run: rm -rf .index-rebuild scripts/rebuild_homepage_corrective.py
      - name: Commit rebuilt homepage
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: restore corrective homepage from main baseline"
          git push origin HEAD:fix/post-seo-content-correction
