name: Mobile Sector Grid

on:
  pull_request:
    branches: [main]
    paths:
      - "index.html"
      - "js/tbm-product-network-v7.js"
      - "css/**"
      - "tests/test_mobile_sector_grid.py"
      - ".github/workflows/mobile-sector-grid.yml"
  push:
    branches: [fix/mobile-sector-card-overlap]
    paths:
      - "index.html"
      - "js/tbm-product-network-v7.js"
      - "css/**"
      - "tests/test_mobile_sector_grid.py"
      - ".github/workflows/mobile-sector-grid.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mobile-layout:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Playwright and Chromium
        run: |
          python -m pip install --disable-pip-version-check playwright==1.53.0
          python -m playwright install --with-deps chromium

      - name: Start local preview
        run: |
          python -m http.server 4173 --bind 127.0.0.1 > /tmp/tbm-mobile-preview.log 2>&1 &
          for attempt in {1..45}; do
            if curl --fail --silent http://127.0.0.1:4173/index.html > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/tbm-mobile-preview.log
          exit 1

      - name: Verify mobile card containment and filtering
        run: python tests/test_mobile_sector_grid.py

      - name: Upload mobile screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-sector-grid-evidence
          path: artifacts/mobile-sector-grid/**
          if-no-files-found: warn
          retention-days: 14
