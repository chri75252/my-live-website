name: Forge API validation
on:
  pull_request:
    branches: [main]
    paths: ["backend/forge-api/**", ".github/workflows/forge-api.yml"]
  push:
    branches: [main]
    paths: ["backend/forge-api/**", ".github/workflows/forge-api.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/forge-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/forge-api/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npx wrangler deploy --dry-run
