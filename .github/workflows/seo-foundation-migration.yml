name: Apply SEO Foundation

on:
  push:
    branches:
      - seo/search-authority-foundation
    paths:
      - scripts/apply_seo_foundation.py
      - scripts/seo_validate.py
      - .github/workflows/seo-foundation-migration.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out SEO branch
        uses: actions/checkout@v4
        with:
          ref: seo/search-authority-foundation
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Apply deterministic migration
        run: python scripts/apply_seo_foundation.py

      - name: Validate public search contracts
        run: python scripts/seo_validate.py

      - name: Check whitespace and patch integrity
        run: git diff --check

      - name: Commit generated implementation
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet && git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "seo: apply search, trust and AI-discovery foundation"
          git push origin HEAD:seo/search-authority-foundation
