name: Apply Sector Filter and Branding Fix

on:
  push:
    branches: [fix/restore-sector-filters-latest-branding]
    paths:
      - "scripts/restore_sector_filters_and_branding.py"
      - ".github/workflows/apply-sector-filter-branding-fix.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/restore-sector-filters-latest-branding
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Apply focused restoration
        run: python scripts/restore_sector_filters_and_branding.py
      - name: Validate focused surface
        env:
          PR_BASE_SHA: 61016485b958a09d47edd502668289928d50d94b
        run: |
          python scripts/seo_validate.py
          python scripts/validate_corrective_surface.py
          git diff --check
          test "$(git diff --name-only -- js/tbm-cinematic-v10.js js/home-v2.js js/tbm-product-network-v7.js css/tbm-cinematic-v10.css css/site-v2.css | wc -l)" -eq 0
      - name: Commit generated changes
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet && [[ -z "$(git status --porcelain)" ]]; then
            echo "No generated changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ./*.html blog/*.html scripts/validate_corrective_surface.py
          git commit -m "fix: restore sector filters and latest brand assets"
          git push origin HEAD:fix/restore-sector-filters-latest-branding
